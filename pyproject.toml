[project]
name = "contextcon-adlc"
version = "0.1.0"
description = "Cross-agent ADLC memory, auditability, AMP Postgres branching, and token benchmark built on Meko"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "tiktoken>=0.8.0",
  "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
meko-adlc = "meko_adlc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meko_adlc"]

[tool.pytest.ini_options]
pythonpath = ["src", "target_repo"]
testpaths = ["tests", "target_repo/tests"]
